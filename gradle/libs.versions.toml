# Version catalog for reconciliation-service.
#
# ARCHITECTURE.md places this file in the `card-billing-shared` submodule, shared by all four
# services. That repo does not exist yet, so the catalog lives here in the shape it will have
# there; moving it is a one-line change in settings.gradle.kts.
#
# Entries with no version are managed by the Spring Boot BOM (spring-boot-dependencies), so they
# stay aligned with whatever Boot itself was tested against.

[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
springdoc = "3.1.0"
resilience4j = "2.4.0"
opencsv = "5.12.0"
wiremock = "3.13.2"
archunit = "1.5.0"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# Boot 4 dropped spring-boot-starter-aop; spring-boot-starter-aspectj is its replacement, and
# Resilience4j's @CircuitBreaker/@Retry annotations are aspects, so this is what makes them fire.
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# Boot 4 split the per-technology test slices out of spring-boot-test-autoconfigure; MockMvc's
# @AutoConfigureMockMvc now lives in this module.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

postgresql = { module = "org.postgresql:postgresql" }
# Boot 4 moved auto-configuration into per-technology modules. spring-boot-flyway is the one that
# runs migrations on startup (flyway-core alone only puts the library on the classpath);
# spring-boot-restclient is the one that contributes the RestClient.Builder the billing client uses.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-spring-boot = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }

# Testcontainers 2.x (what Boot 4.1 manages) renamed its modules from `junit-jupiter`/`postgresql`
# to the `testcontainers-` prefixed coordinates below.
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
